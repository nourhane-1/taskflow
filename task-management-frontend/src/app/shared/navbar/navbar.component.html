<div class="topbar">
  <button class="menu-btn" (click)="toggleMenu()">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
      <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="logo" routerLink="/">TaskFlow</div>

  <nav class="tnav">
    <a class="tni" routerLink="/boards" routerLinkActive="on">Boards</a>
    <a class="tni" routerLink="/reports" routerLinkActive="on">Reports</a>
    <a class="tni" routerLink="/settings" routerLinkActive="on">Settings</a>
  </nav>

  <div class="search-wrap">
    <div class="srch">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearch()"
        (blur)="closeSearch()"
        placeholder="Search..."
      />
    </div>
    
    <div class="search-results" *ngIf="showResults">
      <div class="no-results" *ngIf="searchResults.length === 0">No results found</div>
      <div class="result-item" *ngFor="let result of searchResults"
           (mousedown)="goToResult(result)">
        <span class="result-type" [class]="result.type">{{ result.type }}</span>
        {{ result.title }}
        <span class="result-board" *ngIf="result.type !== 'board'">in {{ result.boardTitle }}</span>
      </div>
    </div>
  </div>

  <div class="tright">
    <div class="ibt" (click)="themeService.toggle()" title="Toggle theme">
      <svg *ngIf="!themeService.current" width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M8 1a7 7 0 1 0 7 7A5.5 5.5 0 0 1 8 1z" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <svg *ngIf="themeService.current" width="15" height="15" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.5 1.5M11.5 11.5L13 13M13 3l-1.5 1.5M4.5 11.5L3 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="ibt notif-btn" (click)="toggleNotifications()" tabindex="0" (blur)="closeNotifications()">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M8 1a5.5 5.5 0 0 1 5.5 5.5c0 2.5-.8 3.5-1 5H3.5c-.2-1.5-1-2.5-1-5A5.5 5.5 0 0 1 8 1z" stroke="currentColor" stroke-width="1.3"/>
        <path d="M6 13.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <span class="notif-dot" *ngIf="unreadCount > 0">{{ unreadCount }}</span>

      <div class="notif-panel" *ngIf="showNotifications" (click)="$event.stopPropagation()">
        <div class="notif-header">
          <span>Notifications</span>
          <span class="notif-clear" *ngIf="notifications.length > 0" (click)="notificationService.clear()">Clear all</span>
        </div>
        <div class="notif-empty" *ngIf="notifications.length === 0">No notifications</div>
        <div class="notif-item" *ngFor="let n of notifications" [class.unread]="!n.read">
          <div class="notif-msg">{{ n.message }}</div>
          <div class="notif-time">{{ n.time | date:'h:mm a' }}</div>
        </div>
      </div>
    </div>

    <div class="av" (click)="goToSettings()">{{ getInitials() }}</div>
  </div>
</div>
